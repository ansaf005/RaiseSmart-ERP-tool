<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
  <!-- Background -->
  <rect width="450" height="120" fill="none"/>
  
  <!-- Purple Shield -->
  <path d="M15,10 Q50,10 50,45 Q50,90 15,105 Q-20,90 -20,45 Q-20,10 15,10" fill="url(#grad1)" transform="translate(25, 0)" />
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b100e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a008a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- "R" inside the shield -->
  <g transform="translate(25, 0)">
    <path d="M5,35 L25,35 A10,10 0 0,1 25,55 L5,55 Z" fill="none" stroke="white" stroke-width="6"/>
    <path d="M5,35 L5,70" fill="none" stroke="white" stroke-width="6"/>
    <path d="M12,55 L32,75" fill="none" stroke="white" stroke-width="6"/>
    <!-- Orange accent triangle -->
    <polygon points="12,58 30,76 5,76" fill="#f59e0b"/>
  </g>

  <!-- Main Text -->
  <text x="90" y="48" font-family="system-ui, Arial, sans-serif" font-size="38" font-weight="900" fill="#3f3f46" letter-spacing="1.5">RAISE SMART</text>
  
  <!-- Subtext -->
  <text x="92" y="74" font-family="system-ui, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3f3f46" letter-spacing="5">SCHOOL OF TECHNOLOGY</text>
  
  <!-- UPSKILLING PARTNER Pill -->
  <rect x="110" y="88" width="220" height="26" rx="13" fill="url(#grad1)"/>
  <text x="220" y="106" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="bold" fill="white" letter-spacing="1" text-anchor="middle">UPSKILLING PARTNER</text>
</svg>
